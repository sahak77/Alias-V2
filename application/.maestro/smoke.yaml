# Fast offline smoke: launch and reach live gameplay. No timer waits — validates
# the launch path, navigation, and that the action row is tappable.
#
# Dev (Expo Go): appId is Expo Go; openLink loads the project from Metro.
# Standalone build: set `appId: am.smartsoft.alias` and drop the openLink step.
appId: host.exp.Exponent
---
- launchApp
- openLink: exp://127.0.0.1:8081
- extendedWaitUntil:
    visible: 'Alias'
    timeout: 40000
- tapOn:
    text: 'Play|New game'
- assertVisible: 'Preset'
- scrollUntilVisible:
    element:
      text: 'Start Game'
    direction: DOWN
- tapOn: 'Start Game'
- assertVisible: 'Start Round'
- tapOn: 'Start Round'
- assertVisible: 'Correct'
- assertVisible: 'Skip'
