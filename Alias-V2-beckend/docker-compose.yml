# Local dev stack. NOT used in production (Railway provisions managed Postgres).
# The backend boots fine without this running — the DB pool is lazy and the
# firm-v2 proxy needs no DB. Bring it up only for DB/Drizzle work.
services:
  postgres:
    image: postgres:17
    container_name: alias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alias
      POSTGRES_PASSWORD: alias
      POSTGRES_DB: alias
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alias -d alias']
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: alias-pgweb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGWEB_DATABASE_URL: postgres://alias:alias@postgres:5432/alias?sslmode=disable
    ports:
      - '8081:8081'

volumes:
  pgdata:
